<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wgpu-lab</title>
  <style>
    html, body { margin: 0; height: 100%; background: #141416; color: #ddd; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
    canvas { display: block; outline: none; }
    #status { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px; background: rgba(20, 20, 22, 0.85); white-space: pre-wrap; display: none; }
    #status.shown { display: block; }
    #back { position: fixed; top: 8px; left: 10px; color: #aaa; text-decoration: none; opacity: 0.7; }
    #back:hover { opacity: 1; }
  </style>
</head>
<body>
  <a id="back" href="index.html">&larr; all samples</a>
  <canvas id="canvas" tabindex="-1"></canvas>
  <pre id="status"></pre>
  <script>
    const status = document.getElementById('status');
    function show(text) { status.textContent += text + '\n'; status.classList.add('shown'); }
    // everything goes to the console, only problems are put on the page
    function report(text) {
      console.log(text);
      if (!/^lab \[(info|debug)\]/.test(text)) show(text);
    }
    var Module = {
      canvas: document.getElementById('canvas'),
      print: report,
      printErr: report,
      onAbort: (what) => show('aborted: ' + what),
    };
    // Some browsers have navigator.gpu but hand out no adapter until WebGPU is switched on.
    const how_to_enable =
      'How to switch it on:\n' +
      '  Chrome, Chromium, Edge on Linux: open chrome://flags/#enable-unsafe-webgpu, set it to Enabled, restart the browser\n' +
      '  Firefox on Linux: open about:config, set dom.webgpu.enabled to true, restart the browser';
    if (!navigator.gpu) {
      show('This browser has no WebGPU, or it is switched off.\n' + how_to_enable);
    } else {
      navigator.gpu.requestAdapter().then(function(adapter) {
        if (!adapter) {
          show('This browser has WebGPU, but offers no graphics adapter to this page.\n' + how_to_enable);
        }
      });
    }
  </script>
  {{{ SCRIPT }}}
</body>
</html>
