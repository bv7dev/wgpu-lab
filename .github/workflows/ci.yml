name: CI

on:
  push:
    branches: [main, cleanroom]
  pull_request:

jobs:
  # the same clang-format version as in CONTRIBUTING.md, other versions format slightly differently
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          git ls-files 'include/*' 'src/*.cpp' 'src/*.h' 'src/platform/*' 'samples/*.cpp' 'tests/*.cpp' 'tests/*.h' \
            | xargs pipx run clang-format==23.1.1 --dry-run --Werror

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ubuntu-gcc, os: ubuntu-24.04, cc: gcc-14, cxx: g++-14 }
          - { name: ubuntu-clang, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18 }
          - { name: windows-msvc, os: windows-latest }

    steps:
      - uses: actions/checkout@v4

      # GLFW is built from source on the runner and needs its build dependencies.
      # The runners have no GPU: mesa-vulkan-drivers provides lavapipe, a software Vulkan driver.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libwayland-dev libxkbcommon-dev xorg-dev mesa-vulkan-drivers

      - name: Select compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      # puts cl.exe on the PATH so that the Ninja generator of the presets finds MSVC
      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      # tests that open a window are skipped, everything else renders offscreen
      - name: Test
        run: ctest --preset release -LE display

  # the samples as web pages, built like the gallery on GitHub Pages
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.10
      - name: Configure
        run: emcmake cmake --preset web
      - name: Build
        run: cmake --build --preset web
